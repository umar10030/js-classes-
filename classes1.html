<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="student1"></p>
    <p id="student2"></p>
    <script>
        class student {
            constructor(name,year){

                this.name = name;
                this.year = year;
            }
            age(){
                let date=new Date();
                return date.getFullYear() - this.year;
            }
        }
            student1=new student("nivan", 1999);
            document.getElementById("student1").innerHTML =
            "my name is " + this.student1.name + ", I am " + this.student1.age() + " years old.";
            student2=new student("nivan", 1993);
            document.getElementById("student2").innerHTML =
            "my name is " + this.student2.name + ", I am " + this.student2.age() + " years old.";

        
    </script>    
</body>
</html>
